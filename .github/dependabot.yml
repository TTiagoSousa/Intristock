version: 2
updates:
  - package-ecosystem: npm
    directories: [/apps/backend, /apps/frontend]
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories: [/apps/downloader, /apps/simulator]
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
