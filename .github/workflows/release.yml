name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The annotated tag itself: its message is the release notes
      - run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: The tag matches package.json
        run: |
          for file in package.json apps/backend/package.json apps/frontend/package.json; do
            version="$(node -p "require('./${file}').version")"
            if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} but ${file} is ${version}"
              exit 1
            fi
          done
      - name: The tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_REF_NAME}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }
      - name: Release notes
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > notes.md
          if [ -f "releases/${GITHUB_REF_NAME}/pt-PT.md" ]; then
            {
              echo
              echo '<details><summary>Português</summary>'
              echo
              tail -n +2 "releases/${GITHUB_REF_NAME}/pt-PT.md"
              echo
              echo '</details>'
            } >> notes.md
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(head -n 1 notes.md | sed 's/^# //')"
          tail -n +2 notes.md > body.md
          gh release create "${GITHUB_REF_NAME}" --title "${title}" --notes-file body.md --verify-tag
