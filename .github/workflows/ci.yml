name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql://intristock:intristock@localhost:5432/intristock
    steps:
      - uses: actions/checkout@v5
        with:
          # The ESLint step compares against the PR base
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test -- --ci
      - name: Report blocks match (simulator, backend, schema)
        run: node ../../scripts/check-report-blocks.mjs
      - name: Routes match docs/api.md
        run: node ../../scripts/check-api-docs.mjs --strict
      - name: ESLint errors on changed lines (report only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node ../../scripts/eslint-changed.mjs backend ${{ github.event.pull_request.base.sha }}
      - name: Build
        run: npx nest build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: ESLint errors on changed lines (report only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node ../../scripts/eslint-changed.mjs frontend ${{ github.event.pull_request.base.sha }}
      - name: Type check and build
        run: npm run build
        env:
          VITE_API_URL: /api

  database:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: intristock
          POSTGRES_PASSWORD: intristock
          POSTGRES_DB: intristock
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intristock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql://intristock:intristock@localhost:5432/intristock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy
      - name: The migrations match schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  python:
    name: Python apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [downloader, simulator]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements.txt
      - name: Install
        run: pip install -r apps/${{ matrix.app }}/requirements.txt
      - name: Compile
        working-directory: apps/${{ matrix.app }}
        run: python -m compileall -q intristock_${{ matrix.app }} scripts
      - name: Smoke check (imports and a short run, no network or databases)
        working-directory: apps/${{ matrix.app }}
        run: python scripts/smoke_check.py
      - name: Engine golden values
        if: matrix.app == 'simulator'
        working-directory: apps/simulator
        run: python scripts/golden_check.py
      - name: Ruff (pyflakes and syntax errors)
        working-directory: apps/${{ matrix.app }}
        run: |
          pip install ruff==0.17.3
          ruff check --select F,E9 --output-format github intristock_${{ matrix.app }} scripts

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR -S warning deploy/proxmox/*.sh
