name: Feature request
description: Suggest something new or a change to an existing screen.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: The screen or behaviour you imagine.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you tried or use today.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this.
